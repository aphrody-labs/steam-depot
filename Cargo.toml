# SPDX-License-Identifier: Apache-2.0
[package]
publish = false
name = "steam-depot"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/src"
description = "Bun OS Steam owner: VDF text/binary parser and writer, install and library discovery, client configuration, Proton launch tuning, Remote Play state."

[lib]
name = "bun_steam"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[features]
default = []
depot = [
  "dep:anyhow",
  "dep:bytes",
  "dep:clap",
  "dep:dirs-next",
  "dep:hex",
  "dep:steamroom",
  "dep:steamroom-client",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:zip",
  "dep:reqwest",
  "dep:libc",
  "dep:qrcode",
]

[dependencies]
qrcode = { workspace = true, features = ["svg"], optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
anyhow = { workspace = true, features = ["std"], optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true, features = ["color", "derive", "env"], optional = true }
dirs-next = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
zip = { workspace = true, features = ["deflate"], optional = true }
steamroom = { workspace = true, optional = true }
steamroom-client = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "tracing-log"], optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = { workspace = true }
