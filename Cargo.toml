# SPDX-License-Identifier: Apache-2.0
[package]
publish = false
name = "steam-depot"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/src"
description = "Bun OS Steam owner: VDF text/binary parser and writer, install and library discovery, client configuration, Proton launch tuning, Remote Play state."

[lib]
name = "bun_steam"

[[bin]]
name = "bun-steam-depot"
path = "src/bin/bun-steam-depot.rs"
required-features = ["depot"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[features]
default = []
depot = [
    "dep:anyhow", "dep:bytes", "dep:clap", "dep:dirs-next", "dep:hex",
    "dep:steamroom", "dep:steamroom-client", "dep:tokio", "dep:tracing",
    "dep:tracing-subscriber", "dep:zip", "dep:reqwest", "dep:libc", "dep:qrcode"
]

[dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["svg"], optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
anyhow = { version = "1.0.104", default-features = false, optional = true, features = ["std"] }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4", optional = true, features = ["derive", "color", "env"] }
dirs-next = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
tokio = { version = "1.53.2", optional = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, optional = true, features = ["std"] }
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }
steamroom = { git = "https://github.com/aphrody-dev/steamroom", rev = "2bc5b67f2c703dff675711de7f565117bdfa6671", optional = true }
steamroom-client = { git = "https://github.com/aphrody-dev/steamroom", rev = "2bc5b67f2c703dff675711de7f565117bdfa6671", optional = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }

reqwest = { version = "0.13", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
